name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ── Job 1: Secret & Dependency Scanning ─────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for gitleaks

      # Secret leak detection — scans git history for leaked API keys, tokens, etc.
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency vulnerability audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Dependency Vulnerability Audit (production deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency Vulnerability Audit (full, informational)
        run: npm audit --audit-level=high || true

      - name: Open-Source License Audit
        run: npx --yes license-checker --summary

  # ── Job 2: SAST — Static Application Security Testing ───────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Focus CodeQL on security-critical queries
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ── Job 3: Build, Lint, Test ─────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: security-scan   # Only run if security scan passes

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node-version: [ 22.x ]
        include:
          - os: ubuntu-latest
            node-version: 24.x

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build TypeScript project
        run: npm run build

      - name: Regenerate Atabey governance scaffold
        run: npm run atabey:setup

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Run Discipline Rules Check (Atabey Compliance)
        run: npm run atabey:check

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
